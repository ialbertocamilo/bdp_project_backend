version: '3.8'

services:
  frankenphp:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    container_name: bdp-app-dev
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8000}:80'
      - '${APP_PORT_HTTPS:-8443}:443'
    environment:
      SERVER_NAME: ':80'
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
      APP_DEBUG: 'true'
      APP_ENV: development
      # FrankenPHP performance settings
      FRANKENPHP_EXTRA_FLAGS: '--max-conns=100'
    working_dir: /app
    volumes:
      - .:/app
    networks:
      - bdp
    depends_on:
      mysql:
        condition: service_healthy
    # Resource limits to prevent container from hogging system resources
    # but generous enough for development
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    # Optimized health check - faster startup feedback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/test"]
      interval: 5s        # Reduced from 10s
      timeout: 3s         # Reduced from 5s
      retries: 3
      start_period: 15s   # Reduced from 30s - critical improvement!

  mysql:
    image: 'mysql/mysql-server:8.0'
    container_name: bdp-mysql-dev
    restart: unless-stopped
    ports:
      - '${FORWARD_DB_PORT:-3309}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    # MySQL performance tuning
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=100
      --max_allowed_packet=256M
      --tmp_table_size=32M
      --max_heap_table_size=32M
      --query_cache_type=1
      --query_cache_size=128M
      --default-storage-engine=InnoDB
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=100M
      --slow_query_log=ON
      --long_query_time=2
      --log_slow_admin_statements=ON
      --log_slow_slave_statements=ON
    volumes:
      - 'mysql-data:/var/lib/mysql'
    networks:
      - bdp
    # Resource limits for database
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Optimized health check
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 3s
      interval: 5s
      start_period: 10s

  # Optional: Redis for caching (commented out by default)
  # Uncomment this when you're ready to use Redis for cache/sessions
  # redis:
  #   image: 'redis:7-alpine'
  #   container_name: bdp-redis-dev
  #   restart: unless-stopped
  #   ports:
  #     - '${FORWARD_REDIS_PORT:-6379}:6379'
  #   networks:
  #     - bdp
  #   command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
  #   volumes:
  #     - 'redis-data:/data'
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     retries: 3
  #     timeout: 3s

networks:
  bdp:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  # redis-data:
  #   driver: local
