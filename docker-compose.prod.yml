version: '3.8'

services:
  frankenphp:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: bdp-app-prod
    restart: always
    ports:
      - '${APP_PORT:-80}:80'
      - '${APP_PORT_HTTPS:-443}:443'
    environment:
      SERVER_NAME: ':80'
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
      APP_DEBUG: 'false'
      APP_ENV: production
    working_dir: /app
    networks:
      - bdp
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mysql:
    image: 'mysql/mysql-server:8.0'
    container_name: bdp-mysql-prod
    restart: always
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 0
    volumes:
      - 'mysql-prod-data:/var/lib/mysql'
    networks:
      - bdp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s
    security_opt:
      - no-new-privileges:true

networks:
  bdp:
    driver: bridge

volumes:
  mysql-prod-data:
    driver: local
