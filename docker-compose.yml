
services:
  frankenphp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bdp-app-dev
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8000}:80'
      - '${APP_PORT_HTTPS:-8443}:443'
    environment:
      SERVER_NAME: ':80'
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
      APP_DEBUG: 'true'
      APP_ENV: development
    working_dir: /app
    volumes:
      - .:/app
    networks:
      - bdp
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/test"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    image: 'mysql/mysql-server:8.0'
    container_name: bdp-mysql-dev
    restart: unless-stopped
    ports:
      - '${FORWARD_DB_PORT:-3309}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'mysql-data:/var/lib/mysql'
    networks:
      - bdp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s

networks:
  bdp:
    driver: bridge

volumes:
  mysql-data:
    driver: local
